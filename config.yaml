# FLODAS UNet inference settings.
# This file must be in the same folder as FLODAS.py.

model:
  # Generally leave empty, unless having more than one .pth files in folder.
  weights_filename: ""

# Tile settings
tiling:
  tile_size: 256
  stride: 128
  nodata_tile_frac: 0.9

# Post-processing settings
postprocessing:
  threshold: 0.90
  min_object_size: 50
  edge_buffer_px: 50

  # Smooth probability raster before thresholding
  apply_gaussian: true
  gauss_sigma: 1.0

  # Smooth final binary mask edges using morphological closing
  apply_morph_smoothing: true
  morph_size: 3

  # Fill small holes inside detected polygons
  fill_holes: true
  min_hole_px: 768

# Probability isobands derived from soft probability raster
isobands:
  enabled: false
  min_prob: 0.10
  step: 0.10

# Output toggles. Outputs are written beside the input raster.
outputs:
  write_probability: true
  write_binary_mask: false
  write_vectors: true
  write_excluded: false
